name: Build ChangeSnap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'ChangeSnap-Android-Project-v*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in the repository."
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          GRADLE_FILE="$(find android-project -type f -name 'gradlew' | head -n 1)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "No gradlew wrapper found in the ZIP. The project must include the Gradle wrapper."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLE_FILE"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChangeSnap-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
