name: Build ChangeSnap APK

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract project ZIP
    run: |
      mkdir project
      unzip -q ChangeSnap-Android-Project-v2.zip -d project
      cp -R project/. .
      sed -i '/lifecycle-runtime-ktx/a\    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")' app/build.gradle.kts

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Build APK
    run: |
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ChangeSnap-APK
      path: app/build/outputs/apk/debug/app-debug.apk
